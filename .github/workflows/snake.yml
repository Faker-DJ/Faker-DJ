# ============================================================================
# CONTRIBUTION SNAKE WORKFLOW
# Menghasilkan animasi ular yang "memakan" kotak contribution graph GitHub,
# lalu menyimpan hasilnya (snake.svg / snake-dark.svg) ke branch "output".
# ============================================================================

name: Generate Contribution Snake

on:
  # Berjalan otomatis setiap 12 jam
  schedule:
    - cron: "0 */12 * * *"

  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch: {}

  # Berjalan setiap kali ada push ke branch main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      # Membuat file snake.svg dan snake-dark.svg dari contribution graph
      - name: Generate snake animation SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=%2300F5FF

      # Mempublikasikan hasil ke branch "output" agar bisa dipanggil
      # langsung dari README.md lewat raw.githubusercontent.com
      - name: Push snake output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
