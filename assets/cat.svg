<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fluffy gray cat jumping and chasing a glowing firefly">
  <defs>
    <radialGradient id="furLight" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#C9D2E6"/>
      <stop offset="55%" stop-color="#8B96B0"/>
      <stop offset="100%" stop-color="#48526C"/>
    </radialGradient>
    <radialGradient id="furSoft" cx="40%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#AEB8D0"/>
      <stop offset="100%" stop-color="#576280"/>
    </radialGradient>
    <radialGradient id="furDark" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#5B6684"/>
      <stop offset="100%" stop-color="#333C54"/>
    </radialGradient>
    <radialGradient id="shadowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000512" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000512" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tagGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#00A8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireflyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="35%" stop-color="#D6FF6B"/>
      <stop offset="100%" stop-color="#9CFF57" stop-opacity="0"/>
    </radialGradient>
    <filter id="fluffBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="700" height="360" fill="#050816"/>

  <!-- ambient background particles -->
  <g opacity="0.55">
    <circle cx="70" cy="55" r="2.1" fill="#00F5FF" filter="url(#glowSoft)">
      <animate attributeName="cy" values="55;35;55" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="630" cy="80" r="1.8" fill="#8B5CF6" filter="url(#glowSoft)">
      <animate attributeName="cy" values="80;60;80" dur="5.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="655" cy="230" r="2.3" fill="#00A8FF" filter="url(#glowSoft)">
      <animate attributeName="cy" values="230;210;230" dur="4.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- the firefly the cat is chasing, wandering on a loose loop -->
  <g>
    <animateMotion dur="6.5s" repeatCount="indefinite"
      path="M 260,120 C 340,60 430,70 470,130 C 505,180 460,220 400,190 C 340,160 300,190 250,170 C 200,150 210,110 260,120 Z"/>
    <circle r="3" fill="url(#fireflyGlow)" filter="url(#glowStrong)">
      <animate attributeName="opacity" values="0.45;1;0.5;1;0.45" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;4.4;3" dur="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ground contact shadow, reacts to the jump -->
  <ellipse cx="345" cy="322" rx="150" ry="16" fill="url(#shadowGlow)">
    <animate attributeName="rx" values="150;110;70;110;155;150" keyTimes="0;0.15;0.45;0.72;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0.6;0.3;0.6;0.9;0.85" keyTimes="0;0.15;0.45;0.72;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- CAT RIG: base position -> side-to-side chase -> jump arc -> squash/stretch -->
  <g transform="translate(345,300)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 30,0; -18,0; 12,0; 0,0" keyTimes="0;0.25;0.5;0.75;1" dur="5.4s" repeatCount="indefinite"/>

      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 0,-6; 0,-78; 0,-6; 0,6; 0,0"
          keyTimes="0;0.15;0.45;0.72;0.85;1" dur="2.4s" repeatCount="indefinite"/>

        <g>
          <animateTransform attributeName="transform" type="scale"
            values="0.94,1.06; 1.05,0.93; 1.12,0.9; 1.03,0.95; 0.88,1.15; 0.94,1.06"
            keyTimes="0;0.15;0.45;0.72;0.85;1" dur="2.4s" repeatCount="indefinite"/>

          <g transform="translate(-345,-300)">

            <!-- TAIL, whipping with excitement -->
            <path d="M 465,255 C 555,240 590,155 515,98 C 476,68 428,82 430,122"
                  fill="none" stroke="url(#furSoft)" stroke-width="30" stroke-linecap="round" filter="url(#fluffBlur)">
              <animate attributeName="d"
                values="M 465,255 C 555,240 590,155 515,98 C 476,68 428,82 430,122;
                         M 460,258 C 545,205 555,130 490,110 C 460,102 435,130 445,150;
                         M 465,255 C 555,240 590,155 515,98 C 476,68 428,82 430,122"
                dur="1.2s" repeatCount="indefinite"/>
            </path>

            <!-- BODY, layered fluffy masses -->
            <ellipse cx="330" cy="235" rx="150" ry="88" fill="url(#furLight)" filter="url(#fluffBlur)"/>
            <ellipse cx="285" cy="195" rx="96" ry="66" fill="url(#furSoft)" filter="url(#fluffBlur)" opacity="0.9"/>
            <ellipse cx="405" cy="255" rx="80" ry="48" fill="url(#furSoft)" filter="url(#fluffBlur)" opacity="0.75"/>
            <ellipse cx="330" cy="282" rx="118" ry="30" fill="url(#furDark)" filter="url(#fluffBlur)" opacity="0.4"/>

            <!-- fur tufts -->
            <g fill="url(#furSoft)" filter="url(#fluffBlur)" opacity="0.85">
              <ellipse cx="208" cy="236" rx="25" ry="14" transform="rotate(-12 208 236)"/>
              <ellipse cx="230" cy="268" rx="27" ry="13" transform="rotate(8 230 268)"/>
              <ellipse cx="440" cy="288" rx="29" ry="14" transform="rotate(-6 440 288)"/>
            </g>

            <!-- hind legs, coiled to spring -->
            <g stroke="#4B5570" stroke-linecap="round">
              <path d="M 380,275 Q 400,300 390,315" stroke-width="16" fill="none" opacity="0.6"/>
            </g>

            <!-- REACHING FRONT PAW, swipes up toward the firefly -->
            <g>
              <animateTransform attributeName="transform" type="rotate"
                values="0 252 280; 8 252 280; -42 252 280; 5 252 280; 0 252 280; 0 252 280"
                keyTimes="0;0.15;0.45;0.72;0.85;1" dur="2.4s" repeatCount="indefinite"/>
              <ellipse cx="252" cy="280" rx="30" ry="16" fill="url(#furLight)" filter="url(#fluffBlur)"/>
              <g stroke="#3C4560" stroke-width="1.4" opacity="0.5">
                <line x1="240" y1="272" x2="240" y2="288"/>
                <line x1="252" y1="270" x2="252" y2="290"/>
                <line x1="264" y1="272" x2="264" y2="288"/>
              </g>
            </g>

            <!-- HEAD, tilts up excitedly toward the firefly -->
            <g>
              <animateTransform attributeName="transform" type="rotate"
                values="-3 235 172; 0 235 172; -22 235 172; -2 235 172; -3 235 172; -3 235 172"
                keyTimes="0;0.15;0.45;0.72;0.85;1" dur="2.4s" repeatCount="indefinite"/>

              <!-- perked ears -->
              <path d="M 178,118 Q 166,68 202,90 Q 196,118 190,133 Z" fill="url(#furSoft)"/>
              <path d="M 182,108 Q 176,86 194,96 Q 190,114 187,124 Z" fill="#FF00FF" opacity="0.3"/>
              <path d="M 258,108 Q 273,60 300,86 Q 287,116 276,131 Z" fill="url(#furSoft)"/>
              <path d="M 266,103 Q 276,80 293,92 Q 285,112 278,120 Z" fill="#FF00FF" opacity="0.3"/>

              <!-- head mass -->
              <ellipse cx="235" cy="172" rx="80" ry="64" fill="url(#furLight)" filter="url(#fluffBlur)"/>
              <ellipse cx="180" cy="197" rx="34" ry="26" fill="url(#furSoft)" filter="url(#fluffBlur)" opacity="0.9"/>
              <ellipse cx="290" cy="197" rx="36" ry="28" fill="url(#furSoft)" filter="url(#fluffBlur)" opacity="0.9"/>

              <!-- alert, wide-open eyes -->
              <ellipse cx="212" cy="168" rx="9" ry="10" fill="#0E1220"/>
              <ellipse cx="260" cy="166" rx="9" ry="10" fill="#0E1220"/>
              <circle cx="212" cy="168" r="4" fill="#00F5FF" filter="url(#glowSoft)">
                <animate attributeName="opacity" values="1;1;0.1;1" keyTimes="0;0.9;0.95;1" dur="5s" repeatCount="indefinite"/>
              </circle>
              <circle cx="260" cy="166" r="4" fill="#00F5FF" filter="url(#glowSoft)">
                <animate attributeName="opacity" values="1;1;0.1;1" keyTimes="0;0.9;0.95;1" dur="5s" repeatCount="indefinite"/>
              </circle>

              <!-- nose + excited open mouth -->
              <path d="M 232,196 L 240,196 L 236,203 Z" fill="#FF9EDB"/>
              <path d="M 236,203 Q 226,216 224,224 Q 236,222 236,215 Q 236,222 248,224 Q 246,216 236,203 Z"
                    fill="#2A1830" opacity="0.85"/>

              <!-- whiskers, swept back -->
              <g stroke="#D6DEEF" stroke-width="1.1" opacity="0.55">
                <line x1="200" y1="198" x2="155" y2="188"/>
                <line x1="200" y1="205" x2="155" y2="208"/>
                <line x1="270" y1="198" x2="315" y2="186"/>
                <line x1="270" y1="205" x2="315" y2="208"/>
              </g>

              <!-- collar + glowing tag -->
              <path d="M 186,216 Q 235,238 288,214" stroke="#00A8FF" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.9"/>
              <circle cx="236" cy="230" r="7" fill="url(#tagGlow)" filter="url(#glowSoft)">
                <animate attributeName="r" values="6;8.5;6" dur="1.4s" repeatCount="indefinite"/>
              </circle>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
